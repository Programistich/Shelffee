[project]
name = "shelffee"
version = "0.1.0"
description = "Shelffee Telegram bot with Mini App support"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "aiohttp>=3.10",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shelffee*"]
