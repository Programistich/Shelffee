services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shelffee
      POSTGRES_PASSWORD: shelffee
      POSTGRES_DB: shelffee
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelffee -d shelffee"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    env_file: ${ENV_FILE:-.env.dev}
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
